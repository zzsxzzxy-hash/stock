services:
  instockdbservice:
    image: postgres:16
    container_name: InStockPostgres
    environment:
      POSTGRES_USER: instock
      POSTGRES_PASSWORD: instock
      POSTGRES_DB: instockdb
    volumes:
      - instock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instock -d instockdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instock_network

  instockredis:
    image: redis:7-alpine
    container_name: InStockRedis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - instock_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instock_network

  instock:
    image: mayanghua/instock:latest
    container_name: InStock
    ports:
      - "9988:9988"
    environment:
      db_host: instockdbservice
      db_port: 5432
      db_user: instock
      db_password: instock
      db_database: instockdb
      REDIS_HOST: instockredis
      REDIS_PORT: 6379
      REDIS_DB: 0
      redis_host: instockredis
      redis_port: 6379
    volumes:
      - /data/instockproxy.txt:/data/InStock/instock/config/proxy.txt
    depends_on:
      instockdbservice:
        condition: service_healthy
      instockredis:
        condition: service_healthy
    networks:
      - instock_network

volumes:
  instock_pgdata:
  instock_redisdata:

networks:
  instock_network:
    driver: bridge
