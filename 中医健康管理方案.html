<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医健康管理方案</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "STSong", serif; background: #fdf8f0; color: #2c1810; line-height: 1.8; font-size: 15px; }
  .cover { background: linear-gradient(135deg, #8b2e14 0%, #c44d1a 40%, #e8893a 80%, #f5c97a 100%); color: white; padding: 60px 40px 50px; text-align: center; position: relative; overflow: hidden; }
  .cover::before { content: ""; position: absolute; top: -30px; right: -30px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.08); }
  .cover::after { content: ""; position: absolute; bottom: -40px; left: -20px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.06); }
  .cover h1 { font-size: 2.4em; letter-spacing: 6px; font-weight: 700; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); margin-bottom: 10px; }
  .cover .subtitle { font-size: 1.1em; letter-spacing: 3px; opacity: 0.9; margin-bottom: 30px; }
  .cover .meta { font-size: 0.9em; opacity: 0.75; letter-spacing: 2px; }
  .warning-box { background: #fff3cd; border-left: 5px solid #e67e22; margin: 24px 30px; padding: 16px 20px; border-radius: 0 8px 8px 0; }
  .warning-box .warn-title { color: #c0392b; font-weight: 700; font-size: 1em; margin-bottom: 6px; }
  .warning-box p { color: #7d4a00; font-size: 0.92em; line-height: 1.7; }
  .container { max-width: 820px; margin: 0 auto; padding: 0 30px 50px; }
  h2.section-title { font-size: 1.4em; color: #8b2e14; border-bottom: 2px solid #e8893a; padding-bottom: 8px; margin: 32px 0 16px; letter-spacing: 2px; }
  .constitution-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
  .constitution-card { background: white; border-radius: 10px; padding: 14px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .constitution-card.primary { border-top: 4px solid #c44d1a; }
  .constitution-card.secondary { border-top: 4px solid #e8a537; }
  .constitution-card.latent { border-top: 4px solid #8db87a; }
  .constitution-card .c-label { font-size: 0.78em; color: #888; margin-bottom: 4px; }
  .constitution-card .c-name { font-size: 1.1em; font-weight: 700; color: #2c1810; }
  .disease-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .disease-tag { background: #fde8e0; color: #8b2e14; padding: 5px 14px; border-radius: 20px; font-size: 0.88em; border: 1px solid #f4bba8; }
  .principle-box { background: linear-gradient(135deg, #fff8f0, #fef0e0); border-radius: 12px; padding: 20px 24px; margin: 16px 0; border: 1px solid #f0d4b0; }
  .principle-box .p-title { font-weight: 700; color: #8b2e14; font-size: 1em; margin-bottom: 10px; }
  .principle-list { list-style: none; }
  .principle-list li { padding: 4px 0 4px 20px; position: relative; color: #4a2510; font-size: 0.94em; }
  .principle-list li::before { content: "◆"; position: absolute; left: 0; color: #c44d1a; font-size: 0.7em; top: 7px; }
  .week-block { background: white; border-radius: 14px; margin: 24px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden; }
  .week-header { padding: 20px 28px 16px; }
  .week-header.w1 { background: linear-gradient(135deg, #c44d1a, #e8893a); }
  .week-header.w2 { background: linear-gradient(135deg, #c47a1a, #e8b83a); }
  .week-header.w3 { background: linear-gradient(135deg, #1a7a6b, #3ab8a0); }
  .week-header.w4 { background: linear-gradient(135deg, #5a3a8b, #8b6ac4); }
  .week-header .week-num { color: rgba(255,255,255,0.7); font-size: 0.82em; letter-spacing: 2px; }
  .week-header h3 { color: white; font-size: 1.35em; font-weight: 700; letter-spacing: 3px; margin: 4px 0; }
  .week-header .week-focus { color: rgba(255,255,255,0.85); font-size: 0.88em; margin-top: 4px; }
  .week-body { padding: 20px 28px 24px; }
  .sub-section { margin: 18px 0; }
  .sub-title { display: flex; align-items: center; gap: 8px; font-size: 1em; font-weight: 700; color: #4a2510; margin-bottom: 12px; }
  .sub-title .icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1em; flex-shrink: 0; }
  .icon-tea { background: #fde8d8; }
  .icon-food { background: #e8f5e9; }
  .icon-treatment { background: #e3f2fd; }
  .icon-exercise { background: #f3e5f5; }
  .icon-expect { background: #fff8e1; }
  .tea-card { background: #fff8f0; border: 1px solid #f0d4b0; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
  .tea-card .tea-name { font-weight: 700; color: #8b2e14; font-size: 0.96em; margin-bottom: 6px; }
  .tea-detail { font-size: 0.88em; color: #5a3520; line-height: 1.7; }
  .tea-detail strong { color: #4a2510; }
  .food-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .food-card { background: #f8fdf4; border: 1px solid #c8e6c9; border-radius: 8px; padding: 12px 16px; }
  .food-card .meal { font-size: 0.78em; color: #4caf50; font-weight: 700; margin-bottom: 4px; }
  .food-card .food-name { font-weight: 700; color: #2c1810; font-size: 0.94em; margin-bottom: 4px; }
  .food-card .food-detail { font-size: 0.84em; color: #4a6040; line-height: 1.6; }
  .food-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .treatment-item { background: #f0f8ff; border: 1px solid #b3d9f5; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .treatment-item .t-name { font-weight: 700; color: #1565c0; font-size: 0.92em; margin-bottom: 6px; }
  .treatment-item .t-detail { font-size: 0.86em; color: #1a4070; line-height: 1.7; }
  .acupoint { display: inline-block; background: #dbeeff; color: #1565c0; padding: 2px 8px; border-radius: 10px; font-size: 0.82em; font-weight: 600; margin: 2px; }
  .exercise-item { background: #f9f0ff; border: 1px solid #ce93d8; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .exercise-item .e-name { font-weight: 700; color: #6a1b9a; font-size: 0.92em; margin-bottom: 6px; }
  .exercise-item .e-detail { font-size: 0.86em; color: #4a1070; line-height: 1.7; }
  .expect-box { background: linear-gradient(135deg, #fffde7, #fff8e1); border: 1px solid #ffe082; border-radius: 8px; padding: 14px 18px; }
  .expect-box .expect-title { font-weight: 700; color: #f57f17; font-size: 0.92em; margin-bottom: 8px; }
  .expect-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .expect-tag { background: white; border: 1px solid #ffcc02; color: #795548; padding: 4px 12px; border-radius: 14px; font-size: 0.84em; }
  .divider { border: none; border-top: 1px dashed #e0c090; margin: 10px 0; }
  .note-box { background: #fff3e0; border: 1px solid #ffcc80; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 0.84em; color: #7d4a00; }
  .note-box strong { color: #c0392b; }
  .daily-section { background: white; border-radius: 14px; padding: 24px 28px; margin: 24px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .daily-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
  .daily-card { border-radius: 8px; padding: 14px 16px; }
  .daily-card.schedule { background: #e8f5e9; border: 1px solid #a5d6a7; }
  .daily-card.diet { background: #e3f2fd; border: 1px solid #90caf9; }
  .daily-card.emotion { background: #fce4ec; border: 1px solid #f48fb1; }
  .daily-card.danger { background: #ffebee; border: 1px solid #ef9a9a; }
  .daily-card h4 { font-size: 0.92em; font-weight: 700; margin-bottom: 8px; }
  .daily-card.schedule h4 { color: #2e7d32; }
  .daily-card.diet h4 { color: #1565c0; }
  .daily-card.emotion h4 { color: #ad1457; }
  .daily-card.danger h4 { color: #c62828; }
  .daily-card p, .daily-card li { font-size: 0.86em; color: #3a3a3a; line-height: 1.75; }
  .daily-card ul { padding-left: 14px; }
  .forbid-section { background: #fff8f0; border-radius: 14px; padding: 22px 28px; margin: 24px 0; border: 2px solid #f4bba8; }
  .forbid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .forbid-card { background: white; border-radius: 8px; padding: 12px 14px; border-left: 4px solid #c44d1a; }
  .forbid-card h4 { font-size: 0.9em; font-weight: 700; color: #8b2e14; margin-bottom: 6px; }
  .forbid-card p { font-size: 0.84em; color: #5a3520; line-height: 1.7; }
  .summary-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
  .timeline-item { text-align: center; background: white; border-radius: 10px; padding: 14px 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .timeline-item .tl-week { font-size: 0.78em; color: #888; }
  .timeline-item .tl-name { font-weight: 700; font-size: 0.92em; color: #2c1810; margin: 4px 0; }
  .timeline-item .tl-dot { width: 10px; height: 10px; border-radius: 50%; margin: 8px auto 4px; }
  .tl-dot.c1 { background: #c44d1a; }
  .tl-dot.c2 { background: #e8b83a; }
  .tl-dot.c3 { background: #3ab8a0; }
  .tl-dot.c4 { background: #8b6ac4; }
  .footer { text-align: center; padding: 24px; color: #aaa; font-size: 0.82em; border-top: 1px solid #e8d8c0; margin-top: 20px; }
  @media (max-width: 600px) {
    .constitution-grid, .food-row, .food-row3, .daily-grid, .forbid-grid, .summary-timeline { grid-template-columns: 1fr; }
    .container { padding: 0 16px 40px; }
    .week-body { padding: 16px 18px 20px; }
  }
</style>
</head>
<body>
